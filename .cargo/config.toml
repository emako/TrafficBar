[alias]
# Cargo aliases only expand to subcommands, so this runs xtask, which launches setup.ps1.
# Args pass through: cargo setup -- -Target aarch64-pc-windows-msvc
setup = "run --quiet --manifest-path xtask/Cargo.toml --"

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true
