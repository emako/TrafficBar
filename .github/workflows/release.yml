name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Native ARM64 uses the ARM64 MSVC toolset. x64 keeps the default x64 tools.
      - name: Setup MSVC (ARM64 cross tools)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Pack
        shell: pwsh
        run: |
          $tools = Join-Path $env:USERPROFILE ".dotnet\tools"
          if ($env:PATH -notlike "*$tools*") {
            $env:PATH = "$tools;$env:PATH"
          }
          .\setup.ps1 -Target ${{ matrix.target }}

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.target }}
          path: target/publish/*
          if-no-files-found: error

  release:
    needs: pack
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all publish artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/publish-merged
          pattern: publish-*
          merge-multiple: true

      - name: Stage publish dir
        shell: pwsh
        run: |
          $dest = "target\publish"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem -LiteralPath "target\publish-merged" -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $_.Name) -Force
          }
          Get-ChildItem -LiteralPath $dest -File | ForEach-Object { Write-Host $_.Name }

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $toml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Cannot read version from Cargo.toml"
          }
          $cargo = $Matches[1]

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne $cargo) {
              throw "Tag '$tag' does not match Cargo.toml version '$cargo'"
            }
            $name = "TrafficBar $tag"
            $prerelease = "false"
            $makeLatest = "true"
            # New version tags: let GitHub generate notes once.
            $generateNotes = "true"
            $body = ""
          } else {
            # Branch / manual runs: rolling release under tag `latest`.
            # Do not use generate_release_notes here — updating the same release
            # would keep appending another "Full Changelog" line each run.
            $tag = "latest"
            $sha = $env:GITHUB_SHA.Substring(0, 7)
            $name = "TrafficBar latest ($sha)"
            $prerelease = "true"
            $makeLatest = "false"
            $generateNotes = "false"
            $repo = $env:GITHUB_REPOSITORY
            $body = "**Full Changelog**: https://github.com/$repo/commits/$($env:GITHUB_SHA)"
          }

          "version=$cargo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "make_latest=$makeLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "generate_notes=$generateNotes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # multiline body for gh release --notes
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Drop any leftover draft/partial release for this tag (failed softprops
      # uploads leave drafts that break the next create). Rolling `latest` must
      # also recreate the tag object so target_commitish actually moves forward.
      - name: Delete existing release for tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ($env:TAG -eq "latest") {
            gh release delete latest --yes --cleanup-tag 2>&1 | ForEach-Object { Write-Host $_ }
            gh api --method DELETE "repos/$($env:GITHUB_REPOSITORY)/git/refs/tags/latest" 2>&1 |
              ForEach-Object { Write-Host $_ }
          } else {
            # Keep the version git tag; only remove the release (incl. drafts).
            gh release delete $env:TAG --yes 2>&1 | ForEach-Object { Write-Host $_ }
          }
          exit 0

      # softprops/action-gh-release parallel-uploads ~16 assets and has been
      # aborting mid-flight on windows-latest (Node 24), leaving draft releases.
      # `gh release create` uploads sequentially and surfaces real errors.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          BODY: ${{ steps.meta.outputs.body }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.meta.outputs.make_latest }}
          GENERATE_NOTES: ${{ steps.meta.outputs.generate_notes }}
          TARGET: ${{ github.sha }}
        run: |
          $files = @(Get-ChildItem -LiteralPath "target\publish" -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            throw "No files in target\publish"
          }
          Write-Host ("Publishing $($files.Count) assets to tag $($env:TAG):")
          $files | ForEach-Object { Write-Host ("  " + [System.IO.Path]::GetFileName($_)) }

          $args = @(
            "release", "create", $env:TAG
            "--title", $env:RELEASE_NAME
            "--target", $env:TARGET
          )
          if ($env:PRERELEASE -eq "true") { $args += "--prerelease" }
          if ($env:MAKE_LATEST -eq "true") { $args += "--latest" } else { $args += "--latest=false" }
          if ($env:GENERATE_NOTES -eq "true") {
            $args += "--generate-notes"
          } else {
            $args += "--notes"
            $args += $env:BODY
          }
          $args += $files

          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
